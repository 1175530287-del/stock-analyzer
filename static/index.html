<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Stock Analyzer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "PingFang SC", sans-serif;
  background: #fff;
  color: #1d1d1f;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
.container {
  max-width: 900px;
  margin: 0 auto;
  padding: 0 24px;
  width: 100%;
  flex: 1;
  display: flex;
  flex-direction: column;
}
.container.has-result { padding-top: 30px; }
.input-area { text-align: center; padding-top: 20vh; transition: padding 0.3s; }
.container.has-result .input-area { padding-top: 0; margin-bottom: 20px; }
input[type="text"] {
  width: 180px;
  height: 52px;
  border: none;
  border-bottom: 2px solid #e5e5ea;
  font-size: 28px;
  text-align: center;
  letter-spacing: 4px;
  outline: none;
  font-weight: 500;
  transition: border-color 0.2s;
  caret-color: #ff3b30;
}
input[type="text"]:focus { border-bottom-color: #ff3b30; }
input[type="text"]::placeholder {
  font-size: 16px;
  letter-spacing: 1px;
  color: #c7c7cc;
  font-weight: 400;
}
.btn { display: inline-block; margin: 20px 6px 0; padding: 10px 28px; border: none; border-radius: 24px; background: #ff3b30; color: #fff; font-size: 14px; font-weight: 500; cursor: pointer; transition: opacity 0.2s; -webkit-tap-highlight-color: transparent; }
.btn:active { opacity: 0.7; }
.btn:disabled { opacity: 0.3; cursor: not-allowed; }
.btn-secondary { background: #1d1d1f; }

/* 切换开关 */
.toggle-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 16px; }
.toggle-label { font-size: 13px; color: #c7c7cc; transition: color 0.2s; }
.toggle-label.active { color: #1d1d1f; font-weight: 500; }
.toggle-switch { position: relative; display: inline-block; width: 44px; height: 24px; }
.toggle-switch input { opacity: 0; width: 0; height: 0; }
.toggle-slider {
  position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
  background: #e5e5ea; border-radius: 24px; transition: 0.2s;
}
.toggle-slider:before {
  content: ""; position: absolute; height: 20px; width: 20px;
  left: 2px; bottom: 2px; background: #fff; border-radius: 50%; transition: 0.2s;
}
.toggle-switch input:checked + .toggle-slider { background: #ff3b30; }
.toggle-switch input:checked + .toggle-slider:before { transform: translateX(20px); }

/* 结果区域 */
.result { display: none; }
.result.show { display: block; }
.result-columns {
  display: flex;
  gap: 16px;
  align-items: flex-start;
}
@media (max-width: 640px) {
  .result-columns { flex-direction: column; }
}
.result-column {
  flex: 1;
  min-width: 0;
}
.result-box {
  background: #f5f5f7;
  border-radius: 16px;
  padding: 20px;
  font-size: 13px;
  line-height: 1.7;
  white-space: pre-wrap;
  word-break: break-all;
  font-family: "SF Mono", "Menlo", monospace;
  color: #1d1d1f;
}
.news-box {
  background: #f0f7ff;
  border-radius: 16px;
  padding: 20px;
  font-size: 13px;
  line-height: 1.7;
  white-space: pre-wrap;
  word-break: break-all;
  font-family: "SF Mono", "Menlo", monospace;
  color: #1d1d1f;
}
.error-box {
  background: #fff2f0;
  border-radius: 16px;
  padding: 20px;
  color: #ff3b30;
  font-size: 14px;
  text-align: center;
}
.loading {
  text-align: center;
  padding: 40px;
  color: #8e8e93;
  font-size: 14px;
}
.footer {
  text-align: center;
  padding: 20px;
  color: #c7c7cc;
  font-size: 12px;
}
</style>
</head>
<body>
<div class="container">
  <div class="input-area">
    <input type="text" id="codeInput" placeholder="输入代码或名称" maxlength="20" autocomplete="off" autocorrect="off">
    <div class="toggle-row">
      <span class="toggle-label" id="labelNoHold">未持仓</span>
      <label class="toggle-switch">
        <input type="checkbox" id="holdToggle">
        <span class="toggle-slider"></span>
      </label>
      <span class="toggle-label active" id="labelHold">已持仓</span>
    </div>
    <div>
      <button class="btn" id="analyzeBtn">分析</button>
      <button class="btn btn-secondary" id="sectorBtn">当日板块热度</button>
    </div>
  </div>
  <div id="loading" class="loading" style="display:none;">分析中...</div>
  <div id="result" class="result">
    <div class="result-columns">
      <div class="result-column">
        <div id="resultContent" class="result-box"></div>
      </div>
      <div class="result-column">
        <div id="newsContent" class="news-box"></div>
      </div>
    </div>
  </div>
  <div id="error" class="error-box" style="display:none;"></div>
</div>
<div class="footer">输入股票代码或名称，获取实时分析</div>

<script>
const input = document.getElementById('codeInput');
const btn = document.getElementById('analyzeBtn');
const resultDiv = document.getElementById('result');
const resultContent = document.getElementById('resultContent');
const newsContent = document.getElementById('newsContent');
const errorDiv = document.getElementById('error');
const loadingDiv = document.getElementById('loading');
const holdToggle = document.getElementById('holdToggle');
const labelHold = document.getElementById('labelHold');
const labelNoHold = document.getElementById('labelNoHold');
const container = document.querySelector('.container');

// 切换开关文字高亮
holdToggle.addEventListener('change', function() {
  labelHold.classList.toggle('active', this.checked);
  labelNoHold.classList.toggle('active', !this.checked);
});

// 输入处理
input.addEventListener('input', function() {
  if (this.value.length >= 2) {
    // 不自动触发搜索，让用户自己点按钮或回车
  }
});

// 回车
input.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && this.value.trim().length >= 1) {
    analyze();
  }
});

btn.addEventListener('click', analyze);

const sectorBtn = document.getElementById('sectorBtn');
sectorBtn.addEventListener('click', fetchSectors);

async function fetchNews(code) {
  try {
    const res = await fetch(`/api/news?code=${code}`);
    const data = await res.json();
    
    if (data.error) {
      newsContent.textContent = '消息获取失败';
      return;
    }
    
    let html = '';
    
    if (data.good && data.good.length > 0) {
      html += '✅ 利好\n\n';
      data.good.forEach(item => {
        html += `• ${item.title}\n\n`;
      });
    }
    
    if (data.bad && data.bad.length > 0) {
      html += '❌ 利空\n\n';
      data.bad.forEach(item => {
        html += `• ${item.title}\n\n`;
      });
    }
    
    if (data.neutral && data.neutral.length > 0) {
      html += '➖ 中性\n\n';
      data.neutral.forEach(item => {
        html += `• ${item.title}\n\n`;
      });
    }
    
    if (!html) {
      html = '暂无相关消息';
    }
    
    newsContent.textContent = html;
  } catch (e) {
    newsContent.textContent = '消息获取失败';
  }
}

async function fetchSectors() {
  sectorBtn.disabled = true;
  resultDiv.classList.remove('show');
  newsContent.textContent = '';
  errorDiv.style.display = 'none';
  loadingDiv.style.display = 'block';
  
  try {
    const res = await fetch('/api/hot_sectors');
    const data = await res.json();
    loadingDiv.style.display = 'none';
    
    if (data.error) {
      showError(data.error);
      return;
    }
    
    // 板块热度全宽显示，隐藏新闻栏
    resultContent.textContent = data.data;
    resultContent.style.maxWidth = '100%';
    document.querySelector('.result-columns').style.display = 'block';
    document.querySelectorAll('.result-column')[1].style.display = 'none';
    resultDiv.classList.add('show');
    container.classList.add('has-result');
    
  } catch (e) {
    loadingDiv.style.display = 'none';
    showError('获取失败');
  } finally {
    sectorBtn.disabled = false;
  }
}

async function analyze() {
  const code = input.value.trim();
  if (!code) {
    showError('请输入股票代码或名称');
    return;
  }
  
  btn.disabled = true;
  resultDiv.classList.remove('show');
  newsContent.textContent = '';
  errorDiv.style.display = 'none';
  loadingDiv.style.display = 'block';
  
  try {
    const res = await fetch(`/api/analyze?code=${encodeURIComponent(code)}&hold=${holdToggle.checked ? 1 : 0}`);
    const data = await res.json();
    
    loadingDiv.style.display = 'none';
    
    if (data.error) {
      showError(data.error);
      return;
    }
    
    resultContent.textContent = data.analysis;
    resultDiv.classList.add('show');
    container.classList.add('has-result');
    
    // 恢复双栏布局
    resultContent.style.maxWidth = '';
    document.querySelectorAll('.result-column')[1].style.display = '';
    
    // 同时获取新闻（用返回的股票代码）
    if (data.data && data.data.code) {
      fetchNews(data.data.code);
    }
    
  } catch (e) {
    loadingDiv.style.display = 'none';
    showError('请求失败，请检查网络');
  } finally {
    btn.disabled = false;
  }
}

function showError(msg) {
  errorDiv.textContent = msg;
  errorDiv.style.display = 'block';
  resultDiv.classList.remove('show');
}
</script>
</body>
</html>
